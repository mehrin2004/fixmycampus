<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Student Account - FixMyCampus</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/logo.png">
<link rel="shortcut icon" href="icons/logo.png">
<link rel="apple-touch-icon" href="icons/logo.png">
<meta name="theme-color" content="#0B192C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FixMyCampus">
</head>
<body>
  <div class="phone-screen">
    <div class="content" style="padding-top: 24px;">
      <div class="brand-header" style="margin-bottom: 18px;">
        <img src="icons/logo.png" alt="FixMyCampus Logo" class="brand-logo-img" style="width: 80px; height: 80px; margin-bottom: 8px;">
        <h1 class="brand" style="font-size: 24px;">Create <span class="accent">Student Account</span></h1>
        <p class="subtitle">Join FixMyCampus to report & track campus issues</p>
      </div>

      <div id="alertBox"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <div class="input-wrap">
            <span class="icon">👤</span>
            <input type="text" id="fullName" placeholder="e.g. John Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Campus Email</label>
          <div class="input-wrap">
            <span class="icon">✉️</span>
            <input type="email" id="email" placeholder="student@campus.edu" required>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number <span style="font-weight:400; color:var(--text-muted);">(10 digits)</span></label>
          <div class="input-wrap">
            <span class="icon">📞</span>
            <input type="tel" id="phone" placeholder="9876543210" maxlength="10">
          </div>
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <div class="input-wrap">
            <span class="icon">🎓</span>
            <select id="department" required>
              <option value="">Select Department</option>
              <option>Computer Science</option>
              <option>Information Technology</option>
              <option>Electronics & Communication</option>
              <option>Mechanical Engineering</option>
              <option>Civil Engineering</option>
              <option>MCA</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="year">Academic Year</label>
          <div class="input-wrap">
            <span class="icon">📅</span>
            <select id="year" required>
              <option value="">Select Year</option>
              <option>First Year</option>
              <option>Second Year</option>
              <option>Third Year</option>
              <option>Final Year</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Create Password</label>
          <div class="input-wrap">
            <span class="icon">🔒</span>
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="toggle-eye" onclick="togglePw('password', this)">👁️</button>
          </div>
          <div id="strengthWrap" class="strength-wrap" style="display:none;">
            <div class="strength-bar-bg"><div id="strengthFill" class="strength-bar-fill"></div></div>
            <div id="strengthText" class="strength-text"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <span class="icon">🔒</span>
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
            <button type="button" class="toggle-eye" onclick="togglePw('confirmPassword', this)">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="registerBtn" style="margin-top: 10px;">Create Account</button>
      </form>

      <p class="helper-text" style="margin-bottom: 20px;">Already have an account? <a href="login.html">Login Here</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script>
    function togglePw(id, btn) {
      const el = document.getElementById(id);
      if (el.type === 'password') {
        el.type = 'text';
        btn.textContent = '🙈';
      } else {
        el.type = 'password';
        btn.textContent = '👁️';
      }
    }

    const nameEl = document.getElementById('fullName');
    const emailEl = document.getElementById('email');
    const phoneEl = document.getElementById('phone');
    const deptEl = document.getElementById('department');
    const yearEl = document.getElementById('year');
    const pwEl = document.getElementById('password');
    const confirmPwEl = document.getElementById('confirmPassword');

    nameEl.addEventListener('blur', () => {
      const val = nameEl.value.trim();
      if (val && !Validation.isValidName(val)) {
        Validation.showFieldError(nameEl, 'Full name should be at least 2 characters.');
      } else if (val) {
        Validation.showFieldSuccess(nameEl);
      }
    });

    emailEl.addEventListener('blur', () => {
      const val = emailEl.value.trim();
      if (val && !Validation.isValidEmail(val)) {
        Validation.showFieldError(emailEl, 'Please enter a valid email address.');
      } else if (val) {
        Validation.showFieldSuccess(emailEl);
      }
    });

    phoneEl.addEventListener('input', () => {
      const val = phoneEl.value.trim();
      if (val && !Validation.isValidPhone(val)) {
        Validation.showFieldError(phoneEl, 'Phone number must be exactly 10 digits.');
      } else if (val) {
        Validation.showFieldSuccess(phoneEl);
      } else {
        Validation.clearFieldError(phoneEl);
      }
    });

    deptEl.addEventListener('change', () => {
      if (deptEl.value) Validation.showFieldSuccess(deptEl);
    });

    yearEl.addEventListener('change', () => {
      if (yearEl.value) Validation.showFieldSuccess(yearEl);
    });

    pwEl.addEventListener('input', () => {
      const val = pwEl.value;
      const strengthWrap = document.getElementById('strengthWrap');
      const strengthFill = document.getElementById('strengthFill');
      const strengthText = document.getElementById('strengthText');

      if (!val) {
        strengthWrap.style.display = 'none';
        return;
      }
      strengthWrap.style.display = 'block';
      const result = Validation.checkPasswordStrength(val);
      strengthWrap.className = 'strength-wrap ' + result.class;
      strengthText.textContent = result.text;

      if (val.length >= 6) {
        Validation.showFieldSuccess(pwEl);
      }

      if (confirmPwEl.value) {
        if (confirmPwEl.value !== val) {
          Validation.showFieldError(confirmPwEl, 'Passwords do not match.');
        } else {
          Validation.showFieldSuccess(confirmPwEl);
        }
      }
    });

    confirmPwEl.addEventListener('input', () => {
      if (confirmPwEl.value !== pwEl.value) {
        Validation.showFieldError(confirmPwEl, 'Passwords do not match.');
      } else {
        Validation.showFieldSuccess(confirmPwEl);
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('registerBtn');
      alertBox.innerHTML = '';

      const formData = {
        fullName: nameEl.value.trim(),
        email: emailEl.value.trim(),
        phone: phoneEl.value.trim(),
        department: deptEl.value,
        year: yearEl.value,
        password: pwEl.value,
        confirmPassword: confirmPwEl.value
      };

      if (!Validation.validateRegistration(formData)) {
        alertBox.innerHTML = `<div class="alert error"><span class="err-icon">⚠️</span> Please fix the errors highlighted above before registering.</div>`;
        Toast.warning('Please fix the errors in the form before submitting.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="loading-spinner" style="width: 20px; height: 20px; border-width: 2px; display: inline-block;"></span> Creating account...`;

      try {
        const { token, user } = await Api.register(formData);
        Auth.setSession(token, user);
        Toast.success('Account created successfully! Welcome to FixMyCampus 🎉');
        setTimeout(() => { window.location.href = 'student-home.html'; }, 400);
      } catch (err) {
        const msg = err.message || 'Registration failed.';
        alertBox.innerHTML = `<div class="alert error"><span class="err-icon">⚠️</span> ${msg}</div>`;
        Toast.error(msg);
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
