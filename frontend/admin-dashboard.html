<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - FixMyCampus</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B192C">
<link rel="apple-touch-icon" href="icons/logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FixMyCampus">
</head>
<body>
  <div class="phone-screen">
    <div class="topbar">
      <span>Admin Dashboard</span>
      <div class="spacer"></div>
      <img src="icons/logo.png" alt="FixMyCampus Logo" class="topbar-logo">
    </div>
    
    <div class="content" id="dashboardContainer">
      <script>document.write(renderSkeletons(4));</script>
    </div>

    <div class="bottom-nav">
      <a href="admin-dashboard.html" class="active"><span class="nav-icon">📊</span>Dashboard</a>
      <a href="all-complaints.html"><span class="nav-icon">📋</span>All Tickets</a>
      <a href="#" onclick="Auth.logout('admin-login.html'); return false;"><span class="nav-icon">🚪</span>Logout</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    Auth.requireAdmin();

    const categoryIcons = {
      'Electrical': '💡', 'Plumbing': '🚰', 'Pipelines': '🌊', 'Pipelines & Drainage': '🌊',
      'Steel Materials': '⚙️', 'Steel Materials & Metal': '⚙️', 'Gardens': '🌻', 'Gardens & Landscaping': '🌻',
      'Trees': '🌳', 'Trees & Vegetation': '🌳', 'Furniture': '🪑', 'Furniture / Civil': '🪑',
      'Sanitation': '🚽', 'Sanitation & Hygiene': '🚽', 'Internet / Network': '📶',
      'Internet & Wi-Fi': '📶', 'Other': '📌'
    };

    async function loadDashboard() {
      const container = document.getElementById('dashboardContainer');
      container.innerHTML = renderSkeletons(4);
      try {
        const stats = await Api.getAdminStats();
        container.innerHTML = `
          <div style="margin-bottom:16px;">
            <h2 style="font-family:'Outfit',sans-serif; color:var(--navy); font-size:22px; margin-bottom:4px;">Campus Overview</h2>
            <div class="slogan-pill" style="font-size:10px;">REPORT • TRACK • RESOLVE</div>
          </div>

          <div class="stat-grid animate-fade-up">
            <div class="stat-card admin-card-hover">
              <div class="icon-circle">📋</div>
              <div><div class="num">${stats.totalComplaints}</div><div class="label">Total Issues</div></div>
            </div>
            <div class="stat-card admin-card-hover">
              <div class="icon-circle" style="background:var(--pending-bg);color:var(--pending-text);">⏳</div>
              <div><div class="num">${stats.pending}</div><div class="label">Pending</div></div>
            </div>
            <div class="stat-card admin-card-hover">
              <div class="icon-circle" style="background:var(--progress-bg);color:var(--progress-text);">🕓</div>
              <div><div class="num">${stats.inProgress}</div><div class="label">In Progress</div></div>
            </div>
            <div class="stat-card admin-card-hover">
              <div class="icon-circle" style="background:var(--completed-bg);color:var(--completed-text);">✅</div>
              <div><div class="num">${stats.completed}</div><div class="label">Completed</div></div>
            </div>
          </div>

          <div class="section-heading animate-fade-up">
            <h3 style="font-family:'Outfit',sans-serif; font-weight:700;">Recent Campus Tickets</h3>
            <a href="all-complaints.html" style="color:var(--primary); font-weight:700;">View All →</a>
          </div>

          ${stats.recentComplaints.length === 0
            ? `<div class="empty-state">No campus complaints submitted yet.</div>`
            : stats.recentComplaints.map(c => `
              <a href="complaint-management.html?id=${c.id}" class="complaint-item animate-row-enter">
                <div class="complaint-thumb" style="display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--primary-light);color:var(--primary);">${categoryIcons[c.category] || '📌'}</div>
                <div class="complaint-info">
                  <div class="name">${c.title || c.category}</div>
                  <div class="meta">📍 ${c.location || 'Campus Location'}</div>
                </div>
                <span class="badge" data-status="${c.status}">${c.status}</span>
              </a>
            `).join('')}
        `;
      } catch (err) {
        container.innerHTML = `<div class="alert error"><span class="err-icon">⚠️</span> ${err.message}</div>`;
        Toast.error(err.message);
      }
    }
    loadDashboard();
  </script>
</body>
</html>
